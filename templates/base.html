<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon/CVBRecorder_icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-image: url("{{ url_for('static', filename='background_pic/' + current_bg) }}");
        }


    </style>
    <title>
        {% block title %}
        {% endblock %}
    </title>
</head>

<body>
    {% block header %}
            <div style="display: flex; align-items: center; gap: 50px;">
                
                <a href="{{ url_for('home') }}" 
                    style="margin-top: 30px; margin-left: 200px;">
                    <img src="{{ url_for('static', filename='icon/CVBRecorder_full.png') }}" 
                        alt="" width="150">
                </a>
                
                <div style="margin-top: 30px; margin-left: 400px; gap: 40px; display: flex;">
                    <a href="{{url_for('home')}}">Home</a>
                    <a href="{{url_for('anime.animes')}}">Animes</a>
                    <a href="{{url_for('game.games')}}">Games</a>
                    <a href="{{url_for('settings')}}">Setting</a>
                </div>
            </div>
        <br>
    {% endblock %}
        
    {% block content %}     
    {% endblock %}

    {% block footer %}
    {% endblock %}
</body>
</html>
