{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block header %}
{{ super() }}
<h1>Settings</h1>
{% endblock %}

{% block content %}
<div>
    <h3>General Settings</h3>
</div>
<div>
    <h5>Background Image Settings</h5>
    <form action="" method = "post" style="display: flex; align-items: center; gap: 2px;" enctype="multipart/form-data">
        <input type="file" name="bg_pic" accept="image/*" style="width: auto;">
        <button type="submit" 
            style="width: 80px; height: 30px; font-size: 16px; display: flex; align-items: center; justify-content: center;">Upload</button>
    </form>
    
    <div>
        {% for img in images %}
            <a href="{{ url_for('choose_bg', bg_name = img) }}"><img src="{{ url_for('static', filename='background_pic/' + img) }}" width = "150"></a>
        {% endfor %}
    </div>
</div>
{% endblock %}
