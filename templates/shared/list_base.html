{% extends "base.html" %}
{% block content %}
    <input type="text" placeholder="Enter a name" id="search">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="display: flex; gap: 12px;">
            <a href="" id="10">10</a>
            <a href="" id="25">25</a>
            <a href="" id="50">50</a>
        </div>
        <button id="filterBT" onclick="document.getElementById('filterTable').showModal()">Sort</button>
    </div>

    <dialog id="filterTable">
        <header>
        </header>
        <form id="filterForm" onsubmit="applyFilter(event)">
            <main>
                <label for="yearSelect"> Year
                    <select name="yearSelect" id="yearSelect">
                        <option value="">All</option>
                        <option value="1990">1990</option>
                        <option value="1991">1991</option>
                        <option value="1992">1992</option>
                        <option value="1993">1993</option>
                        <option value="1994">1994</option>
                        <option value="1995">1995</option>
                        <option value="1996">1996</option>
                        <option value="1997">1997</option>
                        <option value="1998">1998</option>
                        <option value="1999">1999</option>
                        <option value="2000">2000</option>
                        <option value="2001">2001</option>
                        <option value="2002">2002</option>
                        <option value="2003">2003</option>
                        <option value="2004">2004</option>
                        <option value="2005">2005</option>
                        <option value="2006">2006</option>
                        <option value="2007">2007</option>
                        <option value="2008">2008</option>
                        <option value="2009">2009</option>
                        <option value="2010">2010</option>
                        <option value="2011">2011</option>
                        <option value="2012">2012</option>
                        <option value="2013">2013</option>
                        <option value="2014">2014</option>
                        <option value="2015">2015</option>
                        <option value="2016">2016</option>
                        <option value="2017">2017</option>
                        <option value="2018">2018</option>
                        <option value="2019">2019</option>
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </label>
                {% block filter %}

                {% endblock %}
            </main>
                <div style="display: flex; gap: 50px;">
                    <button onclick="document.getElementById('filterTable').close()">Back</button>
                    <button type="submit">Confirm</button> 
                </div>
        </form>
    </dialog>

    <table id="table">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Name</th>
                <th onclick="sortTable(1)">Release Date</th>
                <th onclick="sortTable(2)">Type</th>
                <th onclick="sortTable(3)">Status</th>
            </tr>
        </thead>
        {% block table_body %}

        {% endblock %}
    </table>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <button id="pre_bt">Previous</button>
        <button id="next_bt">Next</button>
    </div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/list.js') }}"></script>
{% endblock %}
